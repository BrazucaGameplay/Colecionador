<svg xmlns="http://www.w3.org/2000/svg" width="1383" height="947" viewBox="0 0 1383 947">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4b5"/>
      <stop offset=".14" stop-color="#ffdb68"/>
      <stop offset=".34" stop-color="#b85b08"/>
      <stop offset=".48" stop-color="#fff2a0"/>
      <stop offset=".66" stop-color="#d58a19"/>
      <stop offset=".84" stop-color="#7d3006"/>
      <stop offset="1" stop-color="#ffeaa0"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#713008"/>
      <stop offset=".25" stop-color="#ffd56b"/>
      <stop offset=".5" stop-color="#fff3b0"/>
      <stop offset=".72" stop-color="#c57913"/>
      <stop offset="1" stop-color="#713008"/>
    </linearGradient>
    <radialGradient id="velvet" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#8f0610"/>
      <stop offset=".43" stop-color="#650008"/>
      <stop offset="1" stop-color="#250005"/>
    </radialGradient>
    <radialGradient id="ruby" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#fff4d4"/>
      <stop offset=".18" stop-color="#ff6870"/>
      <stop offset=".52" stop-color="#c90027"/>
      <stop offset="1" stop-color="#510014"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

