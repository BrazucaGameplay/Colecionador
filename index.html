<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0f1a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Conquistador de Waifu's</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #0b0f1a; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #0b0f1a; touch-action: none; }
    #game canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
    #build-version { position: fixed; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10000; padding: 5px 8px; border: 1px solid rgba(255,255,255,.22); border-radius: 6px; background: rgba(11,15,26,.78); color: rgba(255,255,255,.82); font: 600 10px/1.2 system-ui, sans-serif; letter-spacing: .04em; pointer-events: none; user-select: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="build-version">COLECIONADOR · v__APP_VERSION__</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
