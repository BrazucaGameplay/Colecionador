<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0f1a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Conquistador de Waifu's</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-height: 100%; margin: 0; padding: 0; overflow: hidden; overscroll-behavior: none; background: #0b0f1a; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background: #0b0f1a; touch-action: none; }
    #game canvas { display: block; width: 100% !important; height: 100% !important; touch-action: none; }
    #loading-screen { position: fixed; inset: 0; z-index: 20000; overflow: hidden; display: grid; place-items: center; background: #0b0f1a; color: #fff; font-family: system-ui, sans-serif; }
    #loading-screen .loading-content { position: absolute; inset: 0; }
    #loading-screen .loading-progress { position: absolute; left: max(22px, env(safe-area-inset-left)); right: max(22px, env(safe-area-inset-right)); bottom: max(28px, calc(env(safe-area-inset-bottom) + 18px)); }
    #loading-screen .loading-track { height: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.55); border-radius: 20px; background: rgba(8,10,16,.72); }
    #loading-screen .loading-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#b66a35,#f3c47a); transition: width .22s ease; }
    #loading-screen .loading-meta { display:flex; justify-content:space-between; gap:12px; margin-top:10px; color:#fff; font-size:12px; text-shadow:0 2px 5px #000; }
    #loading-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .55s ease, visibility .55s ease; }
  </style>
</head>
<body>
  <main id="loading-screen" role="status" aria-live="polite" aria-label="Carregando o jogo">
    <div class="loading-content">
      <div class="loading-backdrop" aria-hidden="true"></div>
      <img class="loading-art" alt="" aria-hidden="true"/>
      <div class="loading-shade" aria-hidden="true"></div>
      <div class="loading-brand">
        <div class="loading-kicker">UM MUNDO DE AVENTURAS</div>
        <div class="loading-title">CONQUISTADOR</div>
        <div class="loading-subtitle">DE WAIFU'S</div>
      </div>
      <div class="loading-progress">
        <div class="loading-heading"><span class="loading-message">Preparando aventura...</span><span class="loading-percent">0%</span></div>
        <div class="loading-track"><div class="loading-fill"></div></div>
        <div class="loading-meta"><span class="loading-hint">Carregando recursos do mundo</span><span class="loading-version">COLECIONADOR · v__APP_VERSION__</span></div>
      </div>
    </div>
  </main>
  <div id="game"></div>
  <div id="build-version" style="position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:10000;padding:5px 8px;border:1px solid rgba(255,255,255,.22);border-radius:6px;background:rgba(11,15,26,.78);color:rgba(255,255,255,.82);font:600 10px/1.2 system-ui,sans-serif;letter-spacing:.04em;pointer-events:none;user-select:none">COLECIONADOR · v__APP_VERSION__</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
