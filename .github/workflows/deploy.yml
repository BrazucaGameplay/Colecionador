name: Deploy
"on":
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Verify current character and weapon assets
        run: |
          test -s public/assets/characters/crimson-flame-sovereign/character.glb
          test -s public/assets/characters/crimson-veinblade/character.glb
          test -s public/assets/weapons/Colossal_Sword_optimized.glb
          echo "Character and weapon assets verified."
      - run: npm run build
      - name: Verify assets in build output
        run: |
          test -s dist/assets/characters/crimson-flame-sovereign/character.glb
          test -s dist/assets/characters/crimson-veinblade/character.glb
          test -s dist/assets/weapons/Colossal_Sword_optimized.glb
          echo "Build assets verified."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
