name: Deploy
"on":
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Download and verify original player model
        env:
          MODEL_URL: https://github.com/BrazucaGameplay/Colecionador/releases/download/1.1.4/warrior.glb
          EXPECTED_SHA256: 78c2615adbe2cb2b1f18c2bd3c4b6936022a45c5fbd561354cd6c55827c0974d
        run: |
          mkdir -p public/assets/characters/warrior
          curl --fail --location --retry 3 --retry-delay 2 "$MODEL_URL" --output public/assets/characters/warrior/warrior.glb
          echo "$EXPECTED_SHA256  public/assets/characters/warrior/warrior.glb" | sha256sum --check
          test "$(stat -c%s public/assets/characters/warrior/warrior.glb)" -eq 32744112
          echo "Verified original GLB: $(stat -c%s public/assets/characters/warrior/warrior.glb) bytes"
      - name: Commit original model into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/warrior/warrior.glb
          if ! git diff --cached --quiet; then
            git commit -m "Add original warrior GLB player asset"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Original warrior GLB is already committed."
          fi
      - run: npm run build
      - name: Verify model is present in build output
        run: |
          test -s dist/assets/characters/warrior/warrior.glb
          cmp public/assets/characters/warrior/warrior.glb dist/assets/characters/warrior/warrior.glb
          echo "Verified model in build: $(stat -c%s dist/assets/characters/warrior/warrior.glb) bytes"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
