name: Deploy
"on":
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify package and lockfile versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages?.['']?.version) {
            throw new Error(`Version mismatch: package.json=${pkg.version}, package-lock.json=${lock.version}, lock root=${lock.packages?.['']?.version}`);
          }
          console.log(`Source and lockfile versions match: ${pkg.version}`);
          NODE
      - name: Install dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci
          else
            echo "Lockfile ausente neste checkout; gerando lockfile temporário para validar o build."
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi
      - name: Audit all dependencies
        run: npm audit --audit-level=low
      - name: Test game systems and character action priorities
        run: npm test
      - run: npm run build
      - name: Verify version in built application
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const html = readFileSync('dist/index.html', 'utf8');
          const expected = `COLECIONADOR · v${version}`;

          if (!html.includes(expected)) {
            throw new Error(`Version mismatch: expected "${expected}" in dist/index.html`);
          }
          if (html.includes('__APP_VERSION__')) {
            throw new Error('Unresolved application version placeholder in dist/index.html');
          }

          console.log(`Built application version verified: ${version}`);
          NODE
      - name: Validate sprite foot anchors in source and build
        run: |
          node scripts/validate-character-sprites.mjs public/assets/characters/sprites/skin_01
          node scripts/validate-character-sprites.mjs dist/assets/characters/sprites/skin_01
          node scripts/validate-character-skin-atlas.mjs public/assets/characters/sprites/skin_2
          node scripts/validate-character-skin-atlas.mjs dist/assets/characters/sprites/skin_2
      - name: Validate enabled monster sprite atlases in source and build
        run: |
          node scripts/validate-monster-sprites.mjs public/assets/monsters
          node scripts/validate-monster-sprites.mjs dist/assets/monsters
      - name: Verify player sprite atlases
        run: |
          for asset in \
            skin-basicas-idle \
            skin-basicas-running \
            skin-basicas-dead \
            skin-batalha-combate_dd; do
            test -s "public/assets/characters/sprites/skin_01/${asset}.png"
            test -s "public/assets/characters/sprites/skin_01/${asset}.json"
            test -s "dist/assets/characters/sprites/skin_01/${asset}.png"
            test -s "dist/assets/characters/sprites/skin_01/${asset}.json"
          done
          echo "Player sprite atlases verified."
      - name: Create deployed code integrity manifest
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { join, relative, extname } from 'node:path';

          const root = 'dist';
          const files = [];
          async function walk(directory) {
            for (const item of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, item.name);
              if (item.isDirectory()) {
                await walk(path);
                continue;
              }
              const rel = relative(root, path).split('\\').join('/');
              if (rel !== 'index.html' && !/\.(?:m?js|css)$/i.test(extname(rel))) continue;
              const bytes = await readFile(path);
              files.push({
                path: rel,
                sha256: createHash('sha256').update(bytes).digest('hex'),
                bytes: bytes.length
              });
            }
          }
          await walk(root);
          if (!files.some(file => file.path === 'index.html') || !files.some(file => /\.js$/i.test(file.path))) {
            throw new Error('Build manifest is missing index.html or JavaScript bundles.');
          }
          await writeFile(join(root, 'build-manifest.json'), JSON.stringify({
            version: JSON.parse(await readFile('package.json', 'utf8')).version,
            files
          }, null, 2) + '
');
          console.log(`Created integrity manifest for ${files.length} deployed code files.`);
          NODE
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify published version and deployed code integrity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          APP_VERSION="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          echo "Checking published application at ${PAGE_URL} for version ${APP_VERSION}"
          for attempt in $(seq 1 18); do
            if PAGE_URL="${PAGE_URL}" APP_VERSION="${APP_VERSION}" GITHUB_SHA="${GITHUB_SHA}" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';

          const base = process.env.PAGE_URL;
          const expectedVersion = process.env.APP_VERSION;
          const cacheBust = process.env.GITHUB_SHA;
          const fetchText = async path => {
            const url = new URL(path, base);
            url.searchParams.set('verify', cacheBust);
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status} for ${path}`);
            return Buffer.from(await response.arrayBuffer());
          };

          try {
            const manifestBytes = await fetchText('build-manifest.json');
            const manifest = JSON.parse(manifestBytes.toString('utf8'));
            if (manifest.version !== expectedVersion) {
              throw new Error(`Manifest version mismatch: ${manifest.version} != ${expectedVersion}`);
            }
            const html = (await fetchText('index.html')).toString('utf8');
            const expectedLabel = `COLECIONADOR · v${expectedVersion}`;
            if (!html.includes(expectedLabel) || html.includes('__APP_VERSION__')) {
              throw new Error('Published HTML does not contain the expected application version.');
            }
            const scripts = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(match => match[1]);
            if (!scripts.length) throw new Error('Published HTML has no JavaScript entry point.');
            const manifestPaths = new Set(manifest.files.map(file => file.path));
            if (!manifestPaths.has('index.html')) throw new Error('Integrity manifest does not cover index.html.');
            for (const file of manifest.files) {
              const bytes = file.path === 'index.html' ? Buffer.from(html) : await fetchText(file.path);
              const actual = createHash('sha256').update(bytes).digest('hex');
              if (actual !== file.sha256 || bytes.length !== file.bytes) {
                throw new Error(`Published file differs from build output: ${file.path}`);
              }
            }
            for (const script of scripts) {
              const normalized = script.replace(/^\/+/, '').replace(/^Colecionador\//, '');
              if (!manifestPaths.has(normalized)) throw new Error(`Published script is absent from integrity manifest: ${script}`);
            }
            console.log(`Published version ${expectedVersion} verified; ${manifest.files.length} HTML/JS/CSS files match the exact build.`);
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }
          NODE
            then
              exit 0
            fi
            echo "Published files not fully updated yet (attempt ${attempt}/18); waiting 10 seconds..."
            sleep 10
          done
          echo "Published application failed version or code-integrity verification."
          exit 1
