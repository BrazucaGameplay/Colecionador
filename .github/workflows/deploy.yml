name: Deploy
"on":
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Bake character spritesheets"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && github.actor != 'github-actions[bot]' &&
       !contains(join(github.event.head_commit.modified, ','), 'tools/character-baker/') &&
       !contains(join(github.event.head_commit.modified, ','), 'scripts/bake-character-sprites.mjs') &&
       !contains(join(github.event.head_commit.modified, ','), 'src/rendering/characters/CharacterAnimationCatalog.js') &&
       !contains(join(github.event.head_commit.modified, ','), 'src/rendering/characters/CharacterSpriteRenderer.js') &&
       !contains(join(github.event.head_commit.modified, ','), '.github/workflows/bake-characters.yml'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify package and lockfile versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages?.['']?.version) {
            throw new Error(`Version mismatch: package.json=${pkg.version}, package-lock.json=${lock.version}, lock root=${lock.packages?.['']?.version}`);
          }
          console.log(`Source and lockfile versions match: ${pkg.version}`);
          NODE
      - name: Install dependencies
        run: |
          if [ -s package-lock.json ]; then
            npm ci
          else
            echo "Lockfile ausente neste checkout; gerando lockfile temporário para validar o build."
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi
      - name: Audit all dependencies
        run: npm audit --audit-level=low
      - name: Test game systems and character action priorities
        run: npm test
      - name: Verify current character models
        run: |
          for model in \
            'skin-padrão1.glb' \
            'skin_padrão2.glb' \
            'skin_padrão3.glb' \
            'skin_padrão4.glb'; do
            test -s "public/assets/characters/skin_01/$model"
          done
          echo "Current character models verified."
      - run: npm run build
      - name: Verify version in built application
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const html = readFileSync('dist/index.html', 'utf8');
          const expected = `COLECIONADOR · v${version}`;

          if (!html.includes(expected)) {
            throw new Error(`Version mismatch: expected "${expected}" in dist/index.html`);
          }
          if (html.includes('__APP_VERSION__')) {
            throw new Error('Unresolved application version placeholder in dist/index.html');
          }

          console.log(`Built application version verified: ${version}`);
          NODE
      - name: Verify current models in build output
        run: |
          for model in \
            'skin-padrão1.glb' \
            'skin_padrão2.glb' \
            'skin_padrão3.glb' \
            'skin_padrão4.glb'; do
            test -s "dist/assets/characters/skin_01/$model"
          done
          echo "Build character models verified."
      - name: Validate sprite foot anchors in source and build
        run: |
          node scripts/validate-character-sprites.mjs public/assets/characters/sprites/skin_01
          node scripts/validate-character-sprites.mjs dist/assets/characters/sprites/skin_01
      - name: Validate enabled monster sprite atlases in source and build
        run: |
          node scripts/validate-monster-sprites.mjs public/assets/monsters
          node scripts/validate-monster-sprites.mjs dist/assets/monsters
      - name: Verify player sprite atlases
        run: |
          for asset in \
            skin-basicas-idle \
            skin-basicas-running \
            skin-basicas-dead \
            skin-basicas-flirty_strut \
            skin-batalha-combate_dd \
            skin-batalha-salto \
            skin-batalha-right_hand_sword_slash; do
            test -s "public/assets/characters/sprites/skin_01/${asset}.png"
            test -s "public/assets/characters/sprites/skin_01/${asset}.json"
            test -s "dist/assets/characters/sprites/skin_01/${asset}.png"
            test -s "dist/assets/characters/sprites/skin_01/${asset}.json"
          done
          echo "Player sprite atlases verified."
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify published application version
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          APP_VERSION="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          EXPECTED="COLECIONADOR · v${APP_VERSION}"
          echo "Checking ${PAGE_URL} for ${EXPECTED}"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "${PAGE_URL}?verify=${GITHUB_SHA}" --output /tmp/published-index.html 2>/dev/null; then
              if grep --fixed-strings --quiet "${EXPECTED}" /tmp/published-index.html && ! grep --fixed-strings --quiet '__APP_VERSION__' /tmp/published-index.html; then
                echo "Published version verified: ${APP_VERSION}"
                exit 0
              fi
            fi
            echo "Publication not updated yet (attempt ${attempt}/18); waiting 10 seconds..."
            sleep 10
          done
          echo "Published page did not expose expected version ${APP_VERSION}."
          exit 1
