name: Deploy
"on":
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify current character and weapon assets
        run: |
          test -s public/assets/characters/skin_01/character.glb
          test -s public/assets/weapons/Colossal_Sword_optimized.glb
          echo "Character and weapon assets verified."
      - run: npm run build
      - name: Verify assets in build output
        run: |
          test -s dist/assets/characters/skin_01/character.glb
          test -s dist/assets/weapons/Colossal_Sword_optimized.glb
          echo "Build assets verified."
      - name: Verify player sprite atlases
        run: |
          for asset in \
            skin-padrao-1-running \
            skin-padrao-1-walking \
            skin-padrao-2-running \
            skin-padrao-2-walking \
            skin-padrao-2-idle \
            skin-padrao-3-running \
            skin-padrao-3-walking \
            skin-padrao-4-running \
            skin-padrao-4-walking \
            character-anterior-idle_03 \
            character-anterior-combate \
            character-anterior-combate_dd; do
            test -s "public/assets/characters/sprites/skin_01/${asset}.png"
            test -s "public/assets/characters/sprites/skin_01/${asset}.json"
            test -s "dist/assets/characters/sprites/skin_01/${asset}.png"
            test -s "dist/assets/characters/sprites/skin_01/${asset}.json"
          done
          echo "Player sprite atlases verified."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
