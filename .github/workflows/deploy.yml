name: Deploy
"on":
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Verify current character and weapon assets
        run: |
          test -s public/assets/characters/skin_01/character.glb
          test -s public/assets/characters/crimson-veinblade/character.glb
          test -s public/assets/weapons/Colossal_Sword_optimized.glb
          echo "Character and weapon assets verified."
      - run: npm run build
      - name: Verify assets in build output
        run: |
          test -s dist/assets/characters/skin_01/character.glb
          test -s dist/assets/characters/crimson-veinblade/character.glb
          test -s dist/assets/weapons/Colossal_Sword_optimized.glb
          echo "Build assets verified."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_attempt_1.outputs.page_url || steps.deployment_attempt_2.outputs.page_url || steps.deployment_attempt_3.outputs.page_url }}
    steps:
      # GitHub Pages can sporadically return HTTP 500 after a successful build.
      # Retry the same uploaded artifact before marking the deployment as failed.
      - id: deployment_attempt_1
        name: Deploy to GitHub Pages (attempt 1)
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: deployment_attempt_2
        name: Deploy to GitHub Pages (retry 1)
        if: steps.deployment_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: deployment_attempt_3
        name: Deploy to GitHub Pages (retry 2)
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Fail if all deployment attempts failed
        if: steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure' && steps.deployment_attempt_3.outcome == 'failure'
        run: |
          echo "GitHub Pages failed after three deployment attempts."
          exit 1
