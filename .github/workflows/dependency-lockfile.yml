name: Dependency lockfile
"on":
  push:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/dependency-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: main-maintenance
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking security fixes to transitive dependencies
        run: npm audit fix --package-lock-only || echo "Some advisories require additional review; continuing to preserve the lockfile and test results."
      - name: Install exactly from lockfile
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Commit lockfile to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          npm install --package-lock-only --ignore-scripts
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
          else
            git commit -m "chore: add reproducible dependency lockfile"
            git push origin HEAD:main
          fi
      - name: Audit the complete dependency tree
        run: npm audit --audit-level=low
