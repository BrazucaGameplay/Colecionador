name: Bake character spritesheets
"on":
  push:
    branches: [main]
    paths:
      - "public/assets/characters/skin_01/*.glb"
      - "tools/character-baker/**"
      - "scripts/bake-character-sprites.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/bake-characters.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: character-sprites-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Install Chromium for headless WebGL
        run: npx playwright install chromium --with-deps
      - name: Render every animation from the four GLBs
        run: node scripts/bake-character-sprites.mjs
      - name: Commit generated spritesheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/sprites/skin_01
          if git diff --cached --quiet; then
            echo "Spritesheets are already up to date."
          else
            git commit -m "chore: bake character animation spritesheets"
            git push
          fi
