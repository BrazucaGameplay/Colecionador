name: Bake character spritesheets
"on":
  push:
    branches: [main]
    paths:
      - "tools/character-baker/**"
      - "scripts/bake-character-sprites.mjs"
      - "scripts/validate-character-sprites.mjs"
      - "package.json"
      - ".github/workflows/bake-characters.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: character-sprites-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Download pinned GLB sources from Release
        run: |
          mkdir -p public/assets/characters/skin_01/animation-sources
          curl --fail --location --retry 3 \
            "https://github.com/BrazucaGameplay/Colecionador/releases/download/skin-01-animation-sources-v1/animacoes_basicas.glb" \
            --output public/assets/characters/skin_01/animation-sources/animacoes_basicas.glb
          curl --fail --location --retry 3 \
            "https://github.com/BrazucaGameplay/Colecionador/releases/download/skin-01-animation-sources-v1/animacoes_batalha.glb" \
            --output public/assets/characters/skin_01/animation-sources/animacoes_batalha.glb
          echo "5b87f00ff4ce79018a8466b53ce7aeb66116b8aca69631028407b4d1ba5ce5a9  public/assets/characters/skin_01/animation-sources/animacoes_basicas.glb" | sha256sum --check
          echo "f0b3da7edb299d117e9caf41b866696afc7dd7a253fc267ca4477a0ea3b6e355  public/assets/characters/skin_01/animation-sources/animacoes_batalha.glb" | sha256sum --check
      - name: Install Chromium for headless WebGL
        run: npx playwright install chromium --with-deps
      - name: Render every animation from the two GLBs
        run: node scripts/bake-character-sprites.mjs
      - name: Validate generated sprite anchors
        run: node scripts/validate-character-sprites.mjs public/assets/characters/sprites/skin_01
      - name: Increment version when generated sprites change
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          const [major, minor, patch] = pkg.version.split('.').map(Number);
          pkg.version = `${major}.${minor}.${patch + 1}`;
          writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          console.log(`Generated sprite update version: ${pkg.version}`);
          NODE
      - name: Commit generated spritesheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/sprites/skin_01 package.json
          if git diff --cached --quiet; then
            echo "Spritesheets are already up to date."
          else
            git commit -m "chore: bake protagonist animation packs from release sources"
            git pull --rebase origin main
            git push
          fi
